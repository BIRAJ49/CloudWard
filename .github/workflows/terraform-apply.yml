name: Protected manual Terraform apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY exactly after reviewing the plan and cost/security summary
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-aws-eu-north-1
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ROOT: cloudward-infra/environments/aws-eu-north-1
  TF_VERSION: "1.11.4"

jobs:
  guard:
    name: Reject unintended invocation
    runs-on: ubuntu-24.04
    steps:
      - name: Require main and an exact confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_NAME" = "main"
          test "$CONFIRMATION" = "APPLY"

  plan:
    name: Recreate the reviewed plan
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: aws-eu-north-1-plan
    outputs:
      plan_sha256: ${{ steps.checksum.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: eu-north-1
      - name: Initialize backend and plan
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS }}
          TF_VAR_monthly_budget_usd: ${{ vars.MONTHLY_BUDGET_USD }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=eu-north-1" \
            -backend-config="use_lockfile=true"
          terraform plan -no-color -out=tfplan
          ../../../scripts/aws/summarize-terraform-plan.sh tfplan >>"$GITHUB_STEP_SUMMARY"
      - name: Record exact plan checksum
        id: checksum
        working-directory: ${{ env.TF_ROOT }}
        run: printf 'plan_sha256=%s\n' "$(sha256sum tfplan | awk '{print $1}')" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: protected-terraform-plan-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply exact protected plan
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: aws-eu-north-1-apply
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4.2.1
        with:
          name: protected-terraform-plan-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}
      - name: Verify the approved artifact
        working-directory: ${{ env.TF_ROOT }}
        env:
          EXPECTED_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
        run: test "$(sha256sum tfplan | awk '{print $1}')" = "$EXPECTED_SHA256"
      - uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: eu-north-1
      - name: Initialize the same backend
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=eu-north-1" \
            -backend-config="use_lockfile=true"
      - name: Apply only the reviewed plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform apply -auto-approve tfplan
