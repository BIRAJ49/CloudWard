[project]
name = "cloudward-backend"
version = "0.1.0"
description = "CloudWard deterministic control plane"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "celery[redis]==5.6.3",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "kubernetes-asyncio==36.1.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "prometheus-client==0.24.1",
  "pyyaml==6.0.3",
  "pyjwt[crypto]==2.13.0",
  # Kombu 5.6.x currently requires redis<6.5.
  "redis==6.4.0",
  "sqlalchemy[asyncio]==2.0.52",
  "uvicorn[standard]==0.52.2",
]

[dependency-groups]
dev = [
  "aiosqlite==0.22.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires external infrastructure",
  "kubernetes: requires a configured Kubernetes cluster",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"migrations/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["celery.*", "yaml.*", "kubernetes_asyncio.*"]
ignore_missing_imports = true
