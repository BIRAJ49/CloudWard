apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudward-aws-prerequisites
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  project: cloudward-aws-platform
  source:
    repoURL: https://github.com/biraj49/CloudWard.git
    targetRevision: main
    path: k8s/aws/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudward-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - ServerSideApply=true
