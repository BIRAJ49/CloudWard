apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cloudward-aws-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
spec:
  description: Privileged EKS platform add-ons isolated from workload delivery
  sourceRepos:
    - https://github.com/biraj49/CloudWard.git
    - https://github.com/kubernetes-sigs/gateway-api.git
    - https://github.com/kubernetes-sigs/aws-load-balancer-controller.git
    - https://helm.cilium.io/
    - https://kyverno.github.io/kyverno/
    - public.ecr.aws/karpenter
    - https://aws.github.io/eks-charts
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://opencost.github.io/opencost-helm-chart
    - https://charts.chaos-mesh.org
  destinations:
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    - namespace: tetragon
      server: https://kubernetes.default.svc
    - namespace: observability
      server: https://kubernetes.default.svc
    - namespace: opencost
      server: https://kubernetes.default.svc
    - namespace: chaos-mesh
      server: https://kubernetes.default.svc
    - namespace: cloudward-system
      server: https://kubernetes.default.svc
    - namespace: cloudward-ingress
      server: https://kubernetes.default.svc
    - namespace: cloudward-staging
      server: https://kubernetes.default.svc
    - namespace: cloudward-production
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiregistration.k8s.io
      kind: APIService
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: kyverno.io
      kind: ClusterPolicy
    - group: karpenter.sh
      kind: NodePool
    - group: karpenter.k8s.aws
      kind: EC2NodeClass
    - group: cilium.io
      kind: CiliumClusterwideNetworkPolicy
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: cilium.io
      kind: CiliumNode
    - group: cilium.io
      kind: CiliumIdentity
    - group: cilium.io
      kind: CiliumEndpoint
    - group: cilium.io
      kind: CiliumCIDRGroup
    - group: cilium.io
      kind: CiliumLoadBalancerIPPool
    - group: cilium.io
      kind: CiliumL2AnnouncementPolicy
    - group: cilium.io
      kind: CiliumBGPClusterConfig
    - group: cilium.io
      kind: CiliumBGPPeerConfig
    - group: cilium.io
      kind: CiliumBGPAdvertisement
    - group: cilium.io
      kind: CiliumPodIPPool
    - group: cilium.io
      kind: CiliumBGPNodeConfigOverride
    - group: cilium.io
      kind: CiliumExternalWorkload
    - group: cilium.io
      kind: CiliumEnvoyConfig
    - group: cilium.io
      kind: CiliumClusterwideEnvoyConfig
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
