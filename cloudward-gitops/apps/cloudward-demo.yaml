apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudward-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # bootstrap-local-git.sh serves the repository snapshot at this in-cluster
    # URL. The snapshot is ephemeral and does not touch the user's Git history.
    repoURL: git://cloudward-git.git-server.svc.cluster.local/cloudward-gitops.git
    targetRevision: main
    path: cloudward-gitops/environments/local
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudward-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
