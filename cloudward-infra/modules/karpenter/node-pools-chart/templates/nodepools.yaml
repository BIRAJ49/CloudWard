{{- $categories := .Values.allowedInstanceCategories }}
{{- $sizes := .Values.allowedInstanceSizes }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: critical-ondemand
spec:
  weight: 100
  template:
    metadata:
      labels:
        cloudward.io/capacity-class: critical
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: cloudward
      expireAfter: 168h
      terminationGracePeriod: 10m
      requirements:
        - { key: kubernetes.io/arch, operator: In, values: [amd64] }
        - { key: kubernetes.io/os, operator: In, values: [linux] }
        - { key: karpenter.sh/capacity-type, operator: In, values: [on-demand] }
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: {{ $categories | toJson }}
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: {{ $sizes | toJson }}
        - { key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["3"] }
  limits:
    cpu: {{ .Values.limits.critical.cpu | quote }}
    memory: {{ .Values.limits.critical.memory | quote }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets: [{ nodes: "1" }]
---
