user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json
        '{"timestamp":"$time_iso8601","service":"cloudward-nginx",'
        '"request_id":"$cloudward_request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time}';

    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;
    server_tokens off;

    map $http_x_request_id $cloudward_request_id {
        default $http_x_request_id;
        "" $request_id;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    include /etc/nginx/conf.d/*.conf;
}
