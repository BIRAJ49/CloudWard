replicaCount: 3

image:
  repository: ghcr.io/biraj49/cloudward-demo-api
  tag: ""
  digest: ""
  requireDigest: true
  pullPolicy: IfNotPresent

release:
  sourceCommit: ""
  sbomReference: ""
  securityScan: ""
  stagingValidation: "pending"
  rollbackDigest: ""

podLabels:
  cloudward.io/environment: production

demoTarget:
  enabled: false

demoControlAuth:
  required: false
  existingSecret: ""
  key: token

publicRoute:
  enabled: false
  gatewayName: cloudward-public
  gatewayNamespace: cloudward-ingress
  sectionName: http
  hostnames: []
  paths:
    - /
    - /health/live
    - /health/ready
    - /metadata
    - /demo/work

telemetry:
  environment: production

nodeSelector:
  cloudward.io/capacity-class: critical

tolerations:
  - key: cloudward.io/capacity-class
    operator: Equal
    value: critical
    effect: NoSchedule

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 2
