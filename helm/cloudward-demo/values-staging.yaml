replicaCount: 2

image:
  repository: ghcr.io/biraj49/cloudward-demo-api
  tag: ""
  digest: ""
  requireDigest: true
  pullPolicy: IfNotPresent

release:
  sourceCommit: ""
  sbomReference: ""
  securityScan: ""
  stagingValidation: "pending"
  rollbackDigest: ""

podLabels:
  cloudward.io/environment: staging

demoControlAuth:
  required: true
  existingSecret: cloudward-demo-control
  key: token

publicRoute:
  enabled: true
  gatewayName: cloudward-public
  gatewayNamespace: cloudward-ingress
  sectionName: http
  hostnames: []
  paths:
    - /
    - /health/live
    - /health/ready
    - /metadata
    - /demo/work

telemetry:
  environment: staging

nodeSelector:
  cloudward.io/capacity-class: demo

tolerations:
  - key: cloudward.io/capacity-class
    operator: Equal
    value: demo
    effect: NoSchedule

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi
