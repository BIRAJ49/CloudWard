replicaCount: 2

image:
  repository: cloudward-demo-api
  tag: local
  digest: ""
  requireDigest: false
  pullPolicy: IfNotPresent

release:
  identifier: ""
  sourceCommit: ""
  sbomReference: ""
  securityScan: ""
  stagingValidation: ""
  rollbackDigest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podAnnotations:
  cloudward.io/unhealthy-endpoint: /demo/state/unhealthy
podLabels: {}

demoTarget:
  enabled: true

demoControlAuth:
  required: false
  existingSecret: ""
  key: token

# Only these exact read-only paths may be attached to the shared public ALB.
# Failure-control and security-scenario paths are intentionally absent.
publicRoute:
  enabled: false
  gatewayName: cloudward-public
  gatewayNamespace: cloudward-ingress
  sectionName: http
  hostnames: []
  paths:
    - /
    - /health/live
    - /health/ready
    - /metadata
    - /demo/work

telemetry:
  environment: staging
  otlpEndpoint: http://otel-collector.observability.svc.cluster.local:4318

securityScenario:
  c2Url: http://cloudward-c2-simulator.cloudward-staging.svc.cluster.local:8080/observe

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 2
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 2

terminationGracePeriodSeconds: 10

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
