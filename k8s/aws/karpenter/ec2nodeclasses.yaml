apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: cloudward-critical
  labels:
    app.kubernetes.io/part-of: cloudward
spec:
  role: cloudward-aws-eu-north-1-karpenter-node
  amiFamily: AL2023
  amiSelectorTerms:
    # Replace latest with the tested immutable AL2023 alias before production.
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: cloudward-aws-eu-north-1
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: cloudward-aws-eu-north-1
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      rootVolume: true
      ebs:
        volumeType: gp3
        volumeSize: 30Gi
        encrypted: true
        deleteOnTermination: true
  tags:
    Project: CloudWard
    Environment: aws
    ManagedBy: karpenter
    cloudward.io/capacity-class: critical
---
