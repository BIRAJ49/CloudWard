# IAM permissions are attached by Terraform through EKS Pod Identity. These
# service accounts deliberately contain no static credentials or role ARN.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: karpenter
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: cloudward
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: cloudward
