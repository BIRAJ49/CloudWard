deploymentMode: Monolithic
fullnameOverride: loki

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  limits_config:
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
    max_query_length: 168h
    max_entries_limit_per_query: 1000
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  nodeSelector:
    cloudward.io/capacity-class: system
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1536Mi

gateway:
  enabled: true
  replicas: 1
  nodeSelector:
    cloudward.io/capacity-class: system
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 128Mi

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false
test:
  enabled: false
