fullnameOverride: otel-collector
mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.158.0"
command:
  name: otelcol-contrib

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
    storeCheckpoints: true
  kubernetesAttributes:
    enabled: true

config:
  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
    otlphttp/loki:
      endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
  processors:
    resource/cloudward:
      attributes:
        - key: k8s.cluster.name
          value: cloudward-aws-eu-north-1
          action: upsert
        - key: deployment.environment
          from_attribute: k8s.namespace.name
          action: insert
  service:
    pipelines:
      logs:
        receivers: [filelog, otlp]
        processors: [memory_limiter, k8sattributes, resource/cloudward, batch]
        exporters: [otlphttp/loki]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource/cloudward, batch]
        exporters: [otlp/tempo]

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: null
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: null
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

resources:
  requests:
    cpu: 75m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: true
