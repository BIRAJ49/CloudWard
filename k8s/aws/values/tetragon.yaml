tetragon:
  enableProcessCred: true
  enableProcessNs: true
  exportFilename: tetragon.log
  exportFilePerm: "640"
  exportFileMaxSizeMB: 10
  exportFileMaxBackups: 3
  exportFileCompress: true
  exportRateLimit: 120
  exportDenyList: |-
    {"health_check":true}
    {"namespace":["", "kube-system", "tetragon", "observability", "argocd", "kyverno", "karpenter"]}
  resources:
    requests:
      cpu: 75m
      memory: 192Mi
    limits:
      cpu: 750m
      memory: 768Mi

tetragonOperator:
  enabled: true
  replicas: 1
  nodeSelector:
    cloudward.io/capacity-class: system
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

export:
  mode: stdout
