apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudward-gitops-observer
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudward-gitops-observer
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: cloudward-executor
    namespace: cloudward-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudward-gitops-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudward-production-observer
  namespace: cloudward-production
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudward-production-observer
  namespace: cloudward-production
subjects:
  - kind: ServiceAccount
    name: cloudward-executor
    namespace: cloudward-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudward-production-observer
