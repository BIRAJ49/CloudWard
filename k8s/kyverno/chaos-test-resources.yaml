apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: allowed-staging-cpu
  namespace: cloudward-staging
spec:
  mode: all
  selector:
    namespaces:
      - cloudward-staging
    labelSelectors:
      cloudward.io/demo-target: "true"
  stressors:
    cpu:
      workers: 1
      load: 50
  duration: 30s
---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: forbidden-production-cpu
  namespace: cloudward-production
spec:
  mode: all
  selector:
    namespaces:
      - cloudward-production
    labelSelectors:
      cloudward.io/demo-target: "true"
  stressors:
    cpu:
      workers: 1
      load: 50
  duration: 30s
---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: forbidden-unlabeled-cpu
  namespace: cloudward-staging
spec:
  mode: all
  selector:
    namespaces:
      - cloudward-staging
    labelSelectors:
      app.kubernetes.io/name: cloudward-demo
  stressors:
    cpu:
      workers: 1
      load: 50
  duration: 30s
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: forbidden-mixed-namespaces
  namespace: cloudward-staging
spec:
  action: pod-kill
  mode: fixed
  value: "1"
  selector:
    namespaces:
      - cloudward-staging
      - observability
    labelSelectors:
      cloudward.io/demo-target: "true"
  duration: 30s
