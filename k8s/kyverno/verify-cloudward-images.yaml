apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cloudward-verify-signed-images
  annotations:
    policies.kyverno.io/title: Verify CloudWard release images
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    pod-policies.kyverno.io/autogen-controllers: Deployment,StatefulSet,DaemonSet,Job,CronJob
spec:
  admission: true
  background: true
  validationFailureAction: Enforce
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 15
  rules:
    - name: require-approved-keyless-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - cloudward-staging
                - cloudward-production
      verifyImages:
        - imageReferences:
            - ghcr.io/biraj49/cloudward-*
          required: true
          verifyDigest: true
          mutateDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: https://github.com/biraj49/CloudWard/.github/workflows/release.yml@refs/heads/main
                    issuer: https://token.actions.githubusercontent.com
                    rekor:
                      url: https://rekor.sigstore.dev
