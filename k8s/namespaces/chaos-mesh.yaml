apiVersion: v1
kind: Namespace
metadata:
  name: chaos-mesh
  labels:
    app.kubernetes.io/part-of: cloudward
    cloudward.io/environment: local
    cloudward.io/chaos-excluded: "true"
    # Chaos Mesh's node daemon requires host/runtime access by design. The
    # controller is separately restricted to explicitly opted-in namespaces.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
