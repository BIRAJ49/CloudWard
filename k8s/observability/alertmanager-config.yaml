apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: cloudward-webhook
  labels:
    app.kubernetes.io/part-of: cloudward
    cloudward.io/alertmanager-config: "true"
spec:
  route:
    receiver: cloudward-webhook
    groupBy:
      - alertname
      - namespace
      - service
      - environment
    groupWait: 10s
    groupInterval: 30s
    repeatInterval: 2m
    matchers:
      - name: cloudward_notify
        value: "true"
        matchType: =
  receivers:
    - name: cloudward-webhook
      webhookConfigs:
        - url: http://host.k3d.internal:8080/api/v1/webhooks/alertmanager
          sendResolved: true
          maxAlerts: 20
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: cloudward-alertmanager-webhook
                key: token
