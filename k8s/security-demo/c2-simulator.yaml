apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudward-c2-simulator
  namespace: cloudward-staging
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudward-c2-simulator
  namespace: cloudward-staging
  labels:
    app.kubernetes.io/name: cloudward-c2-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudward-c2-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudward-c2-simulator
        cloudward.io/security-simulator: "true"
    spec:
      automountServiceAccountToken: false
      serviceAccountName: cloudward-c2-simulator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: cloudward-c2-simulator:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      terminationGracePeriodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloudward-c2-simulator
  namespace: cloudward-staging
spec:
  selector:
    app.kubernetes.io/name: cloudward-c2-simulator
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudward-c2-simulator
  namespace: cloudward-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudward-c2-simulator
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cloudward.io/demo-target: "true"
      ports:
        - protocol: TCP
          port: 8080
  egress: []
